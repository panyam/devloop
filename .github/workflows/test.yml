name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: panyam/ci-actions/go-build-cache@v0.1.2

      # make test runs make checks first, which needs staticcheck.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - run: make test
